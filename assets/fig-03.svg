<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Figure: architecture diagram placeholder">
  <rect width="800" height="600" fill="#FAF6EB"/>

  <text x="40" y="44" font-family="ui-sans-serif, system-ui, 'Geist', sans-serif" font-size="11" fill="#837A66" letter-spacing="3">FIG. 03 / ARCHITECTURE</text>

  <!-- Boxes -->
  <g stroke="#14213D" fill="#FBF8F1" stroke-width="1.5">
    <rect x="80"  y="130" width="180" height="80"  rx="2"/>
    <rect x="320" y="130" width="180" height="80"  rx="2"/>
    <rect x="560" y="130" width="180" height="80"  rx="2"/>
    <rect x="200" y="290" width="180" height="80"  rx="2"/>
    <rect x="440" y="290" width="180" height="80"  rx="2"/>
    <rect x="320" y="450" width="180" height="80"  rx="2"/>
  </g>

  <!-- Highlighted box -->
  <rect x="320" y="290" width="-220" height="80" fill="none"/>
  <rect x="200" y="290" width="180" height="80" stroke="#B14A1A" stroke-width="2" fill="none" rx="2"/>

  <!-- Connectors -->
  <g stroke="#14213D" fill="none" stroke-width="1.2" opacity="0.7">
    <line x1="170" y1="210" x2="290" y2="290"/>
    <line x1="410" y1="210" x2="290" y2="290"/>
    <line x1="410" y1="210" x2="530" y2="290"/>
    <line x1="650" y1="210" x2="530" y2="290"/>
    <line x1="290" y1="370" x2="410" y2="450"/>
    <line x1="530" y1="370" x2="410" y2="450"/>
  </g>

  <!-- Arrowheads -->
  <g fill="#14213D" opacity="0.7">
    <polygon points="290,290 285,283 295,283"/>
    <polygon points="530,290 525,283 535,283"/>
    <polygon points="410,450 405,443 415,443"/>
  </g>

  <!-- Box labels -->
  <g font-family="ui-sans-serif, system-ui, 'Geist', sans-serif" font-size="13" fill="#14213D" text-anchor="middle" letter-spacing="1">
    <text x="170" y="178">INPUT</text>
    <text x="410" y="178">ENCODER</text>
    <text x="650" y="178">CONTEXT</text>
    <text x="290" y="338">FUSION</text>
    <text x="530" y="338">SOLVER</text>
    <text x="410" y="498">OUTPUT</text>
  </g>

  <!-- Caption -->
  <text x="40" y="560" font-family="ui-sans-serif, system-ui, 'Geist', sans-serif" font-size="13" fill="#4F4738">A schematic of the system; the highlighted module is the focus of this work.</text>
</svg>
