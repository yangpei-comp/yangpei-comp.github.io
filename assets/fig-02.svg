<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Figure: results chart placeholder">
  <rect width="800" height="600" fill="#FAF6EB"/>

  <text x="40" y="44" font-family="ui-sans-serif, system-ui, 'Geist', sans-serif" font-size="11" fill="#837A66" letter-spacing="3">FIG. 02 / RESULTS</text>

  <!-- Axes -->
  <line x1="80" y1="120" x2="80" y2="500" stroke="#14213D" stroke-width="1.5"/>
  <line x1="80" y1="500" x2="740" y2="500" stroke="#14213D" stroke-width="1.5"/>

  <!-- Grid -->
  <g stroke="#DBD3BF" stroke-width="0.8" stroke-dasharray="2 4">
    <line x1="80" y1="200" x2="740" y2="200"/>
    <line x1="80" y1="280" x2="740" y2="280"/>
    <line x1="80" y1="360" x2="740" y2="360"/>
    <line x1="80" y1="440" x2="740" y2="440"/>
  </g>

  <!-- Bars (ours) -->
  <g fill="#14213D">
    <rect x="120" y="380" width="46" height="120"/>
    <rect x="200" y="300" width="46" height="200"/>
    <rect x="280" y="340" width="46" height="160"/>
    <rect x="360" y="220" width="46" height="280"/>
    <rect x="440" y="260" width="46" height="240"/>
    <rect x="520" y="180" width="46" height="320"/>
    <rect x="600" y="240" width="46" height="260"/>
    <rect x="680" y="140" width="46" height="360"/>
  </g>

  <!-- Comparison line (baseline) -->
  <g fill="#B14A1A" opacity="0.85">
    <rect x="120" y="440" width="46" height="4"/>
    <rect x="200" y="380" width="46" height="4"/>
    <rect x="280" y="400" width="46" height="4"/>
    <rect x="360" y="320" width="46" height="4"/>
    <rect x="440" y="340" width="46" height="4"/>
    <rect x="520" y="280" width="46" height="4"/>
    <rect x="600" y="320" width="46" height="4"/>
    <rect x="680" y="240" width="46" height="4"/>
  </g>

  <!-- Legend -->
  <g font-family="ui-sans-serif, system-ui, 'Geist', sans-serif" font-size="11" fill="#4F4738" letter-spacing="1">
    <rect x="560" y="84" width="14" height="10" fill="#14213D"/>
    <text x="582" y="94">ours</text>
    <rect x="640" y="84" width="14" height="10" fill="#B14A1A"/>
    <text x="662" y="94">prior</text>
  </g>

  <!-- Axis label -->
  <text x="80" y="540" font-family="ui-sans-serif, system-ui, 'Geist', sans-serif" font-size="13" fill="#4F4738">benchmarks (1–8) · accuracy</text>
</svg>
