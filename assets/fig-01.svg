<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Figure: network diagram placeholder">
  <rect width="800" height="600" fill="#FAF6EB"/>

  <!-- Label -->
  <text x="40" y="44" font-family="ui-sans-serif, system-ui, 'Geist', sans-serif" font-size="11" fill="#837A66" letter-spacing="3">FIG. 01 / NETWORK</text>

  <!-- Edges -->
  <g stroke="#14213D" stroke-width="1.4" fill="none" opacity="0.55">
    <line x1="180" y1="180" x2="380" y2="260"/>
    <line x1="380" y1="260" x2="580" y2="200"/>
    <line x1="380" y1="260" x2="280" y2="440"/>
    <line x1="380" y1="260" x2="500" y2="420"/>
    <line x1="280" y1="440" x2="500" y2="420"/>
    <line x1="500" y1="420" x2="640" y2="480"/>
    <line x1="180" y1="180" x2="280" y2="440"/>
    <line x1="580" y1="200" x2="640" y2="480"/>
  </g>

  <!-- Nodes -->
  <g fill="#14213D">
    <circle cx="180" cy="180" r="14"/>
    <circle cx="380" cy="260" r="22"/>
    <circle cx="580" cy="200" r="14"/>
    <circle cx="280" cy="440" r="14"/>
    <circle cx="500" cy="420" r="20"/>
    <circle cx="640" cy="480" r="12"/>
  </g>

  <!-- Highlighted node halo -->
  <circle cx="380" cy="260" r="36" stroke="#B14A1A" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="380" cy="260" r="48" stroke="#B14A1A" stroke-width="1" fill="none" opacity="0.25"/>

  <!-- Caption -->
  <text x="40" y="560" font-family="ui-sans-serif, system-ui, 'Geist', sans-serif" font-size="13" fill="#4F4738">Lorem ipsum dolor sit amet - schematic of the proposed framework.</text>
</svg>
